<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" preserveAspectRatio="xMidYMid slice" focusable="false">
      <defs>
        <radialGradient id="water-pearl" cx=".48" cy=".45" r=".62">
